
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-project:
    name: Validate Godot Project
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Show Godot version
        run: godot --version

      - name: Import and validate project
        run: godot --headless --editor --path . --quit
